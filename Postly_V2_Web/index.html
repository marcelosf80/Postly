
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Postly V2 — Marketing Digital</title>
    <link rel="stylesheet" href="./css/style.css">
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>
    <div class="app-container">
        <!-- Header -->
        <header>
            <div class="logo">
                <img src="./assets/img/logo.png" alt="P" onerror="this.src='https://via.placeholder.com/32/6366f1/ffffff?text=P'">
                <span>Postly</span>
            </div>
            <div class="header-actions">
                <i data-lucide="bell" style="color: var(--text-secondary);"></i>
            </div>
        </header>

        <!-- Main Content Area -->
        <main id="main-content">
            <!-- Content will be injected here -->
        </main>

        <!-- Bottom Navigation -->
        <nav class="bottom-nav">
            <a href="#" class="nav-item active" onclick="navigate('dashboard')">
                <i data-lucide="layout-dashboard"></i>
                <span>Inicio</span>
            </a>
            <a href="#" class="nav-item" onclick="navigate('posts')">
                <i data-lucide="file-text"></i>
                <span>Posts</span>
            </a>
            <a href="#" class="fab" onclick="navigate('create')">
                <i data-lucide="plus" style="width: 32px; height: 32px;"></i>
            </a>
            <a href="#" class="nav-item" onclick="navigate('ai')">
                <i data-lucide="sparkles"></i>
                <span>IA</span>
            </a>
            <a href="#" class="nav-item" onclick="navigate('settings')">
                <i data-lucide="settings"></i>
                <span>Ajustes</span>
            </a>
        </nav>
    </div>

    <!-- Modals & Overlays -->
    <div id="modal-container" style="display: none;"></div>

    <!-- Scripts -->
    <script src="./js/config.js"></script>
    <script src="./js/api.js"></script>
    <script src="./js/photo-editor.js"></script>
    <script src="./js/facebook-oauth.js"></script>
    <script src="./js/app.js"></script>
    <script>
        lucide.createIcons();
    </script>
</body>
</html>
