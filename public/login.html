<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Iniciar sesión o crear cuenta en SocialPulse">
    <title>Login — SocialPulse</title>
    <link rel="stylesheet" href="/css/main.css">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⚡</text></svg>">
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <script async defer crossorigin="anonymous" src="https://connect.facebook.net/es_LA/sdk.js"></script>
</head>
<body>
    <!-- Background orbs -->
    <div class="hero-bg" style="position:fixed; z-index:0;">
        <div class="orb orb-1" style="opacity:0.15;"></div>
        <div class="orb orb-2" style="opacity:0.15;"></div>
    </div>

    <div class="auth-page">
        <div class="auth-container">
            <!-- Logo -->
            <div style="text-align:center; margin-bottom: 32px;">
                <a href="/" style="display:inline-flex; align-items:center; gap:8px; font-family:var(--font-display); font-size:26px; font-weight:800; color:var(--text-primary); text-decoration:none;">
                    <span class="logo-icon" style="width:40px;height:40px;font-size:20px;">⚡</span>
                    SocialPulse
                </a>
            </div>

            <!-- Login Form -->
            <div class="auth-card" id="login-form">
                <div class="auth-header">
                    <h1>Bienvenido de vuelta</h1>
                    <p>Ingresá a tu cuenta para continuar</p>
                </div>

                <form onsubmit="handleLogin(event)">
                    <div class="form-group">
                        <label class="form-label" for="login-email">Email</label>
                        <input type="email" id="login-email" class="form-input" placeholder="tu@email.com" required autocomplete="email">
                    </div>
                    <div class="form-group">
                        <label class="form-label" for="login-password">Contraseña</label>
                        <input type="password" id="login-password" class="form-input" placeholder="••••••••" required autocomplete="current-password">
                    </div>
                    <button type="submit" class="btn btn-primary btn-lg" style="width:100%;" id="login-btn">
                        Iniciar Sesión
                    </button>
                </form>

                <div style="margin: 16px 0; display: flex; align-items: center; justify-content: center; gap: 8px; color: var(--text-muted); font-size: 13px;">
                    <div style="flex: 1; height: 1px; background: var(--border);"></div>
                    O continuar con
                    <div style="flex: 1; height: 1px; background: var(--border);"></div>
                </div>
                <div style="display: flex; flex-direction: column; gap: 12px; margin-bottom: 24px;">
                    <div id="googlebtn-login" style="display: flex; justify-content: center;"></div>
                    <button onclick="launchFacebookLogin()" class="btn btn-secondary" style="width:100%; display: flex; align-items: center; justify-content: center; gap: 10px; background: #1877F2; color: white; border: none; height: 40px; border-radius: 4px; font-weight: 500; cursor: pointer;">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="white"><path d="M24 12.073C24 5.405 18.627 0 12 0S0 5.405 0 12.073C0 18.1 4.388 23.094 10.125 24v-8.437H7.078v-3.49h3.047V9.43c0-3.007 1.792-4.669 4.533-4.669 1.312 0 2.686.235 2.686.235v2.953H15.83c-1.491 0-1.956.925-1.956 1.874v2.25h3.328l-.532 3.49h-2.796V24C19.612 23.094 24 18.1 24 12.073z"/></svg>
                        Continuar con Facebook
                    </button>
                </div>

                <div class="auth-switch">
                    ¿No tenés cuenta? <a href="#" onclick="showRegister(event)">Crear cuenta gratis</a>
                </div>
            </div>

            <!-- Register Form -->
            <div class="auth-card" id="register-form" style="display:none;">
                <div class="auth-header">
                    <h1>Crear cuenta</h1>
                    <p>Empezá tu prueba gratuita de 14 días</p>
                </div>

                <form onsubmit="handleRegister(event)">
                    <div class="form-group">
                        <label class="form-label" for="reg-name">Nombre completo</label>
                        <input type="text" id="reg-name" class="form-input" placeholder="Tu nombre" required>
                    </div>
                    <div class="form-group">
                        <label class="form-label" for="reg-email">Email</label>
                        <input type="email" id="reg-email" class="form-input" placeholder="tu@email.com" required autocomplete="email">
                    </div>
                    <div class="form-group">
                        <label class="form-label" for="reg-company">Empresa (opcional)</label>
                        <input type="text" id="reg-company" class="form-input" placeholder="Nombre de tu empresa">
                    </div>
                    <div class="form-group">
                        <label class="form-label" for="reg-country">País</label>
                        <select id="reg-country" class="form-select">
                            <option value="AR">🇦🇷 Argentina</option>
                            <option value="MX">🇲🇽 México</option>
                            <option value="CO">🇨🇴 Colombia</option>
                            <option value="CL">🇨🇱 Chile</option>
                            <option value="PE">🇵🇪 Perú</option>
                            <option value="UY">🇺🇾 Uruguay</option>
                            <option value="EC">🇪🇨 Ecuador</option>
                            <option value="BR">🇧🇷 Brasil</option>
                            <option value="US">🇺🇸 Estados Unidos</option>
                            <option value="ES">🇪🇸 España</option>
                            <option value="OTHER">🌎 Otro</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label class="form-label" for="reg-password">Contraseña</label>
                        <input type="password" id="reg-password" class="form-input" placeholder="Mínimo 6 caracteres" required minlength="6" autocomplete="new-password">
                    </div>
                    <button type="submit" class="btn btn-primary btn-lg" style="width:100%;" id="register-btn">
                        Crear Cuenta Gratis
                    </button>
                </form>

                <div style="margin: 16px 0; display: flex; align-items: center; justify-content: center; gap: 8px; color: var(--text-muted); font-size: 13px;">
                    <div style="flex: 1; height: 1px; background: var(--border);"></div>
                    O continuar con
                    <div style="flex: 1; height: 1px; background: var(--border);"></div>
                </div>
                <div style="display: flex; flex-direction: column; gap: 12px; margin-bottom: 24px;">
                    <div id="googlebtn-register" style="display: flex; justify-content: center;"></div>
                    <button onclick="launchFacebookLogin()" class="btn btn-secondary" style="width:100%; display: flex; align-items: center; justify-content: center; gap: 10px; background: #1877F2; color: white; border: none; height: 40px; border-radius: 4px; font-weight: 500; cursor: pointer;">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="white"><path d="M24 12.073C24 5.405 18.627 0 12 0S0 5.405 0 12.073C0 18.1 4.388 23.094 10.125 24v-8.437H7.078v-3.49h3.047V9.43c0-3.007 1.792-4.669 4.533-4.669 1.312 0 2.686.235 2.686.235v2.953H15.83c-1.491 0-1.956.925-1.956 1.874v2.25h3.328l-.532 3.49h-2.796V24C19.612 23.094 24 18.1 24 12.073z"/></svg>
                        Registrarse con Facebook
                    </button>
                </div>

                <div class="auth-switch">
                    ¿Ya tenés cuenta? <a href="#" onclick="showLogin(event)">Iniciar sesión</a>
                </div>
            </div>

            <!-- Error/Success messages -->
            <div id="auth-message" style="margin-top:16px; text-align:center; font-size:14px; display:none;"></div>
        </div>
    </div>

    <div class="toast-container" id="toast-container"></div>

    <script>
        const API_BASE = '';

        window.onload = async function () {
            // Fetch public config from server
            let config = { google_client_id: '', facebook_app_id: '' };
            try {
                const configRes = await fetch('/api/config');
                config = await configRes.json();
            } catch (e) {
                console.error('Error cargando configuración:', e);
            }

            // Google Init
            if (config.google_client_id) {
                google.accounts.id.initialize({
                    client_id: config.google_client_id,
                    callback: handleGoogleLogin
                });

                google.accounts.id.renderButton(
                    document.getElementById("googlebtn-login"),
                    { theme: "outline", size: "large", text: "continue_with", width: 330 }
                );

                google.accounts.id.renderButton(
                    document.getElementById("googlebtn-register"),
                    { theme: "outline", size: "large", text: "signup_with", width: 330 }
                );
            }

            // Facebook Init
            if (config.facebook_app_id) {
                window.fbAsyncInit = function() {
                    FB.init({
                        appId      : config.facebook_app_id,
                        cookie     : true,
                        xfbml      : true,
                        version    : 'v19.0'
                    });
                };
            }
        };

        function launchFacebookLogin() {
            FB.login(function(response) {
                if (response.status === 'connected') {
                    handleFacebookLogin(response.authResponse);
                }
            }, {scope: 'public_profile,email,pages_show_list,instagram_basic,instagram_content_publish,pages_read_engagement,pages_manage_posts'});
        }

        async function handleFacebookLogin(authResponse) {
            setLoading('login-btn', true);
            try {
                const res = await fetch(`${API_BASE}/api/auth/facebook`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ 
                        accessToken: authResponse.accessToken
                    })
                });

                const data = await res.json();
                if (!res.ok) throw new Error(data.error || 'Error en login con Facebook');

                localStorage.setItem('sp_token', data.token);
                localStorage.setItem('sp_user', JSON.stringify(data.user));
                window.location.href = '/app';
            } catch (error) {
                showMessage(error.message);
                setLoading('login-btn', false);
            }
        }

        async function handleGoogleLogin(response) {
            setLoading('login-btn', true); // generic simple loading state
            try {
                const res = await fetch(`${API_BASE}/api/auth/google`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ credential: response.credential })
                });

                const data = await res.json();
                if (!res.ok) throw new Error(data.error || 'Error en login con Google');

                localStorage.setItem('sp_token', data.token);
                localStorage.setItem('sp_user', JSON.stringify(data.user));
                window.location.href = '/app';
            } catch (error) {
                showMessage(error.message);
                setLoading('login-btn', false);
            }
        }

        // Check if coming from /login#register
        if (window.location.hash === '#register') {
            showRegister();
        }

        // Check if already logged in
        const existingToken = localStorage.getItem('sp_token');
        if (existingToken) {
            window.location.href = '/app';
        }

        function showRegister(e) {
            if (e) e.preventDefault();
            document.getElementById('login-form').style.display = 'none';
            document.getElementById('register-form').style.display = 'block';
        }

        function showLogin(e) {
            if (e) e.preventDefault();
            document.getElementById('register-form').style.display = 'none';
            document.getElementById('login-form').style.display = 'block';
        }

        function showMessage(text, type = 'error') {
            const msg = document.getElementById('auth-message');
            msg.textContent = text;
            msg.style.display = 'block';
            msg.style.color = type === 'error' ? 'var(--danger)' : 'var(--success)';
            setTimeout(() => { msg.style.display = 'none'; }, 5000);
        }

        function setLoading(btnId, loading) {
            const btn = document.getElementById(btnId);
            if (loading) {
                btn.dataset.originalText = btn.textContent;
                btn.innerHTML = '<span class="spinner" style="border-top-color:white;"></span> Procesando...';
                btn.disabled = true;
            } else {
                btn.textContent = btn.dataset.originalText;
                btn.disabled = false;
            }
        }

        async function handleLogin(e) {
            e.preventDefault();
            setLoading('login-btn', true);

            try {
                const response = await fetch(`${API_BASE}/api/auth/login`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        email: document.getElementById('login-email').value,
                        password: document.getElementById('login-password').value
                    })
                });

                const data = await response.json();

                if (!response.ok) {
                    throw new Error(data.error || 'Error al iniciar sesión');
                }

                localStorage.setItem('sp_token', data.token);
                localStorage.setItem('sp_user', JSON.stringify(data.user));
                window.location.href = '/app';
            } catch (error) {
                showMessage(error.message);
            } finally {
                setLoading('login-btn', false);
            }
        }

        async function handleRegister(e) {
            e.preventDefault();
            setLoading('register-btn', true);

            try {
                const response = await fetch(`${API_BASE}/api/auth/register`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        name: document.getElementById('reg-name').value,
                        email: document.getElementById('reg-email').value,
                        company: document.getElementById('reg-company').value,
                        country: document.getElementById('reg-country').value,
                        password: document.getElementById('reg-password').value
                    })
                });

                const data = await response.json();

                if (!response.ok) {
                    throw new Error(data.error || 'Error al crear la cuenta');
                }

                localStorage.setItem('sp_token', data.token);
                localStorage.setItem('sp_user', JSON.stringify(data.user));
                window.location.href = '/app';
            } catch (error) {
                showMessage(error.message);
            } finally {
                setLoading('register-btn', false);
            }
        }
    </script>
</body>
</html>
