<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Iniciar sesión o crear cuenta en Postly">
    <title>Login — Postly</title>
    <link rel="stylesheet" href="./css/main.css">
    <link rel="icon" href="./assets/img/logo.png">
    
    <script src="./js/config.js"></script>
    <script src="./js/local-store.js"></script>
    <script src="./js/api.js?v=2.0"></script>
    <script src="./js/facebook-oauth.js?v=2.0"></script>
    <script>
        // Check for session immediately
        if (localStorage.getItem('sp_token') && localStorage.getItem('sp_user')) {
            window.location.replace('./app.html');
        }
    </script>
</head>
<body>
    <!-- Split Networks Background -->
    <div class="split-bg">
        <div class="split-side split-facebook">
            <svg width="48" height="48" fill="white" viewBox="0 0 24 24"><path d="M24 12.073c0-6.627-5.373-12-12-12s-12 5.373-12 12c0 5.99 4.388 10.954 10.125 11.854v-8.385H7.078v-3.47h3.047V9.43c0-3.007 1.792-4.669 4.533-4.669 1.312 0 2.686.235 2.686.235v2.953H15.83c-1.491 0-1.956.925-1.956 1.874v2.25h3.328l-.532 3.47h-2.796v8.385C19.612 23.027 24 18.062 24 12.073z"/></svg>
        </div>
        <div class="split-side split-instagram">
            <svg width="48" height="48" fill="none" stroke="white" stroke-width="2" viewBox="0 0 24 24"><rect x="2" y="2" width="20" height="20" rx="5"/><circle cx="12" cy="12" r="5"/></svg>
        </div>
    </div>


    <div class="auth-page">
        <div class="auth-container">
            <!-- Logo -->
            <div style="text-align:center; margin-bottom: 32px;">
                <a href="./" style="display:inline-flex; align-items:center; gap:16px; font-family:var(--font-display); font-size:36px; font-weight:800; color:var(--text-primary); text-decoration:none;">
                    <img src="./assets/img/logo.png" alt="Logo" style="width:64px; height:64px; border-radius:12px; box-shadow: 0 8px 24px rgba(0,0,0,0.15);">
                    Postly
                </a>
            </div>

            <!-- Login/Register Card (Simplified) -->
            <div class="auth-card">
                <div class="auth-header">
                    <h1>Tu asistente de Marketing</h1>
                    <p>Conecta tu cuenta de Meta para comenzar a publicar</p>
                </div>

                <div style="display: flex; flex-direction: column; gap: 20px; margin-top: 24px;">
                    <button type="button" class="btn" id="btn-connect-facebook-login" onclick="connectWithFacebook()" style="background: #1877F2; color: white; width: 100%; border: none; font-weight: 600; font-size: 16px; padding: 12px; height: 56px; display: flex; align-items: center; justify-content: center; gap: 12px; border-radius: 12px; box-shadow: 0 4px 12px rgba(24, 119, 242, 0.3); transition: transform 0.2s, background 0.2s; cursor: pointer;">
                        <svg width="24" height="24" fill="currentColor" viewBox="0 0 24 24"><path d="M24 12.073c0-6.627-5.373-12-12-12s-12 5.373-12 12c0 5.99 4.388 10.954 10.125 11.854v-8.385H7.078v-3.47h3.047V9.43c0-3.007 1.792-4.669 4.533-4.669 1.312 0 2.686.235 2.686.235v2.953H15.83c-1.491 0-1.956.925-1.956 1.874v2.25h3.328l-.532 3.47h-2.796v8.385C19.612 23.027 24 18.062 24 12.073z"/></svg>
                        Entrar con Meta
                    </button>
                    <div style="text-align:center; font-size:12px; color: var(--text-muted); display:flex; align-items:center; justify-content:center; gap:6px;">
                        <svg width="14" height="14" fill="currentColor" viewBox="0 0 24 24"><path d="M12 2C6.477 2 2 6.477 2 12c0 4.991 3.657 9.128 8.438 9.878v-6.987h-2.54V12h2.54V9.797c0-2.506 1.492-3.89 3.777-3.89 1.094 0 2.238.195 2.238.195v2.46h-1.26c-1.243 0-1.63.771-1.63 1.562V12h2.773l-.443 2.89h-2.33v6.988C18.343 21.128 22 16.991 22 12c0-5.523-4.477-10-10-10z"/></svg>
                        Conecta con Meta para acceder a tus cuentas.
                    </div>

                    <p style="text-align: center; color: var(--text-muted); font-size: 13px; line-height: 1.5; padding: 0 10px;">
                        Al continuar, aceptas nuestros términos de servicio y política de privacidad.
                    </p>
                </div>
            </div>

            <!-- Error/Success messages -->
            <div id="auth-message" style="margin-top:16px; text-align:center; font-size:14px; display:none;"></div>
        </div>
    </div>

    <div class="toast-container" id="toast-container"></div>

    <script>
        window.onload = function () {
            // Comprobar si ya hay sesión activa
            const existingToken = API.getToken();
            if (existingToken) {
                window.location.href = './app.html';
            }
            if (window.location.hash === '#register') {
                showRegister();
            }
        };

        // Redirigir console.log temporal para Facebook OAuth UX (Spinner manual)
        function showRegister(e) {
            if (e) e.preventDefault();
            document.getElementById('login-form').style.display = 'none';
            document.getElementById('register-form').style.display = 'block';
        }

        function showLogin(e) {
            if (e) e.preventDefault();
            document.getElementById('register-form').style.display = 'none';
            document.getElementById('login-form').style.display = 'block';
        }

        function showMessage(text, type = 'error') {
            const msg = document.getElementById('auth-message');
            msg.textContent = text;
            msg.style.display = 'block';
            msg.style.color = type === 'error' ? 'var(--danger)' : 'var(--success)';
            setTimeout(() => { msg.style.display = 'none'; }, 5000);
        }

        function showToast(text, type = 'error') {
            showMessage(text, type);
        }

        function setLoading(btnId, loading) {
            const btn = document.getElementById(btnId);
            if (!btn) return;
            if (loading) {
                btn.dataset.originalText = btn.innerHTML;
                btn.innerHTML = '<span class="spinner" style="border-top-color:white;width:16px;height:16px;margin-right:8px;"></span> Procesando...';
                btn.disabled = true;
            } else {
                btn.innerHTML = btn.dataset.originalText;
                btn.disabled = false;
            }
        }

        async function handleLogin(e) {
            e.preventDefault();
            setLoading('login-btn', true);
            try {
                const data = await API.login(
                    document.getElementById('login-email').value,
                    document.getElementById('login-password').value
                );
                API.setAuth(data.token, data.user);
                window.location.href = './app.html';
            } catch (error) {
                showMessage(error.message);
            } finally {
                setLoading('register-btn', false);
            }
        }
    </script>
</body>
</html>
