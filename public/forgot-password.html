<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recuperar Contraseña — SocialPulse</title>
    <link rel="stylesheet" href="/css/main.css">
    <style>
        .auth-container { max-width: 400px; margin: 100px auto; padding: 32px; background: white; border-radius: 12px; box-shadow: 0 10px 25px rgba(0,0,0,0.05); }
        .auth-header { text-align: center; margin-bottom: 24px; }
        .auth-logo { width: 64px; height: 64px; margin-bottom: 16px; }
        .auth-title { font-size: 24px; color: #1e293b; margin-bottom: 8px; }
        .auth-subtitle { color: #64748b; font-size: 14px; }
    </style>
</head>
<body style="background: #f8fafc; font-family: 'Inter', sans-serif;">
    <div class="auth-container">
        <div class="auth-header">
            <img src="/assets/img/logo.png" alt="SocialPulse" class="auth-logo">
            <h1 class="auth-title">Recuperar Acceso</h1>
            <p class="auth-subtitle">Ingresa tu email y te enviaremos un enlace para restablecer tu contraseña.</p>
        </div>

        <form id="forgot-form" onsubmit="handleForgot(event)">
            <div class="form-group" style="margin-bottom: 20px;">
                <label class="form-label" for="email">Email</label>
                <input type="email" id="email" class="form-input" placeholder="tu@email.com" required>
            </div>
            
            <button type="submit" id="submit-btn" class="btn btn-primary" style="width: 100%; margin-bottom: 16px;">
                Enviar enlace de recuperación
            </button>
            
            <div style="text-align: center;">
                <a href="/login" style="color: var(--primary); font-size: 14px; text-decoration: none; font-weight: 500;">Volver al inicio de sesión</a>
            </div>
        </form>

        <div id="success-msg" style="display: none; text-align: center; color: #059669; background: #ecfdf5; padding: 16px; border-radius: 8px; border: 1px solid #d1fae5;">
            ✅ Hemos enviado las instrucciones a tu correo. Revisa tu bandeja de entrada.
        </div>
    </div>

    <script>
        async function handleForgot(e) {
            e.preventDefault();
            const email = document.getElementById('email').value;
            const btn = document.getElementById('submit-btn');
            const form = document.getElementById('forgot-form');
            const success = document.getElementById('success-msg');

            btn.disabled = true;
            btn.textContent = 'Enviando...';

            try {
                const res = await fetch('/api/auth/forgot-password', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email })
                });

                if (res.ok) {
                    form.style.display = 'none';
                    success.style.display = 'block';
                } else {
                    const data = await res.json();
                    alert(data.error || 'Ocurrió un error. Intenta de nuevo.');
                    btn.disabled = false;
                    btn.textContent = 'Enviar enlace de recuperación';
                }
            } catch (err) {
                alert('No se pudo conectar con el servidor.');
                btn.disabled = false;
                btn.textContent = 'Enviar enlace de recuperación';
            }
        }
    </script>
</body>
</html>
