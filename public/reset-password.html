<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nueva Contraseña — SocialPulse</title>
    <link rel="stylesheet" href="/css/main.css">
    <style>
        .auth-container { max-width: 400px; margin: 100px auto; padding: 32px; background: white; border-radius: 12px; box-shadow: 0 10px 25px rgba(0,0,0,0.05); }
        .auth-header { text-align: center; margin-bottom: 24px; }
        .auth-logo { width: 64px; height: 64px; margin-bottom: 16px; }
        .auth-title { font-size: 24px; color: #1e293b; margin-bottom: 8px; }
        .auth-subtitle { color: #64748b; font-size: 14px; }
    </style>
</head>
<body style="background: #f8fafc; font-family: 'Inter', sans-serif;">
    <div class="auth-container">
        <div class="auth-header" id="header">
            <img src="/assets/img/logo.png" alt="SocialPulse" class="auth-logo">
            <h1 class="auth-title">Nueva Contraseña</h1>
            <p class="auth-subtitle">Ingresa tu nueva contraseña para volver a entrar.</p>
        </div>

        <form id="reset-form" onsubmit="handleReset(event)">
            <div class="form-group" style="margin-bottom: 20px;">
                <label class="form-label" for="password">Nueva Contraseña</label>
                <input type="password" id="password" class="form-input" placeholder="Mínimo 6 caracteres" minlength="6" required>
            </div>
            
            <div class="form-group" style="margin-bottom: 20px;">
                <label class="form-label" for="confirm-password">Confirmar Contraseña</label>
                <input type="password" id="confirm-password" class="form-input" placeholder="Repite la contraseña" minlength="6" required>
            </div>
            
            <button type="submit" id="submit-btn" class="btn btn-primary" style="width: 100%; margin-bottom: 16px;">
                Actualizar Contraseña
            </button>
        </form>

        <div id="success-msg" style="display: none; text-align: center;">
            <div style="color: #059669; background: #ecfdf5; padding: 16px; border-radius: 8px; border: 1px solid #d1fae5; margin-bottom: 24px;">
                ✅ ¡Contraseña actualizada! Ya puedes iniciar sesión con tu nueva clave.
            </div>
            <a href="/login" class="btn btn-primary" style="width: 100%; display: block; text-decoration: none;">Ir al Login</a>
        </div>

        <div id="error-msg" style="display: none; text-align: center; color: #dc2626; background: #fef2f2; padding: 16px; border-radius: 8px; border: 1px solid #fee2e2;">
            ❌ El enlace es inválido o ha expirado.
            <br><br>
            <a href="/forgot-password" style="color: var(--primary); font-size: 14px; text-decoration: none; font-weight: 500;">Solicitar uno nuevo</a>
        </div>
    </div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const token = urlParams.get('token');

        if (!token) {
            document.getElementById('reset-form').style.display = 'none';
            document.getElementById('header').style.display = 'none';
            document.getElementById('error-msg').style.display = 'block';
        }

        async function handleReset(e) {
            e.preventDefault();
            const password = document.getElementById('password').value;
            const confirm = document.getElementById('confirm-password').value;
            const btn = document.getElementById('submit-btn');
            const form = document.getElementById('reset-form');
            const success = document.getElementById('success-msg');
            const header = document.getElementById('header');

            if (password !== confirm) {
                alert('Las contraseñas no coinciden.');
                return;
            }

            btn.disabled = true;
            btn.textContent = 'Actualizando...';

            try {
                const res = await fetch('/api/auth/reset-password', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ token, password })
                });

                if (res.ok) {
                    form.style.display = 'none';
                    header.style.display = 'none';
                    success.style.display = 'block';
                } else {
                    const data = await res.json();
                    alert(data.error || 'Ocurrió un error. El token puede haber expirado.');
                    btn.disabled = false;
                    btn.textContent = 'Actualizar Contraseña';
                }
            } catch (err) {
                alert('No se pudo conectar con el servidor.');
                btn.disabled = false;
                btn.textContent = 'Actualizar Contraseña';
            }
        }
    </script>
</body>
</html>
